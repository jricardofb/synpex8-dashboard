services:
  redis:
    image: redis:8-alpine
    # BullMQ exige noeviction: com outra politica o Redis pode descartar chaves de fila.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copytrading
    ports: ["5432:5432"]
    volumes: [copytrading_pg:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copytrading"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  copytrading_pg:
